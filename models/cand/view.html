<!doctype html><html><body style="margin:0;background:#cfe6f2"><canvas id=c></canvas>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '../../vendor/three-vrm.module.min.js';
const names = new URLSearchParams(location.search).get('m').split(',');
const W = 300 * names.length, H = 700;
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#cfe6f2');
sc.add(new THREE.HemisphereLight('#fff', '#ccb', 1.6)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(1, 2, 2); sc.add(d);
const cam = new THREE.OrthographicCamera(-0.48 * names.length, 0.48 * names.length, 1.0, -1.0, 0.1, 10); cam.position.set(0, 0.9, 3); cam.lookAt(0, 0.9, 0);
const L = new GLTFLoader(); L.register((p) => new VRMLoaderPlugin(p));
const info = [];
for (let i = 0; i < names.length; i++) {
  const g = await L.loadAsync(names[i] + '.vrm'); const v = g.userData.vrm;
  if (v.meta.metaVersion === '0') VRMUtils.rotateVRM0(v);
  v.scene.position.x = (i - (names.length - 1) / 2) * 0.96; sc.add(v.scene);
  const H = v.humanoid; H.getNormalizedBoneNode('leftUpperArm').rotation.z = -1.25; H.getNormalizedBoneNode('rightUpperArm').rotation.z = 1.25; v.update(0);
  const b = new THREE.Box3().setFromObject(v.scene); info.push([names[i], v.meta.metaVersion, +(b.max.y - b.min.y).toFixed(2)]);
}
window.SHOT = (yaw) => { sc.children.forEach(o => { if (o.isGroup || o.type === 'Group') o.rotation.y = yaw; }); r.render(sc, cam); return r.domElement.toDataURL('image/jpeg', 0.9); };
window.INFO = info;
</script></body></html>
