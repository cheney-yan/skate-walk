<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>女孩 · 长板动作实验室</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe0f2;font-family:-apple-system,"PingFang SC",sans-serif;color:#1d2a33;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none;transition:opacity .4s}
  #ui button{pointer-events:auto;min-height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(255,250,240,.88);font-size:14px;font-weight:600;color:#1d2a33;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #ui button.on{background:#ff8a5c;color:#fff}
  #cap{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:rgba(255,250,240,.86);padding:8px 14px;border-radius:16px;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  #cap small{display:block;font-weight:400;font-size:12px;opacity:.6;text-align:center}
  body.rec #ui{display:none}
  #stam{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);width:min(62vw,300px);pointer-events:none}
  #stam .bar{height:10px;border-radius:6px;background:rgba(255,250,240,.75);box-shadow:0 1px 6px rgba(0,0,0,.12);overflow:hidden;margin-top:4px}
  #stam .fill{height:100%;border-radius:6px;transition:width .2s}
  #spdF{background:linear-gradient(90deg,#a9c8ee,#6d9fe0)}
  #stam .bt{font-size:11px;text-align:center;opacity:.75;margin-top:2px;font-weight:600}
  #stamB{height:12px;border-radius:7px;background:rgba(255,250,240,.75);box-shadow:0 1px 6px rgba(0,0,0,.12);overflow:hidden}
  #stamF{height:100%;width:70%;border-radius:7px;transition:width .2s}
  #stamT{font-size:11px;text-align:center;opacity:.7;margin-top:3px;font-weight:600}
  body.nodbg #ui button:not(#dbg):not(#snd),body.nodbg #cap,body.nodbg #tip{display:none}
  body.nodbg #stam{bottom:calc(env(safe-area-inset-bottom) + 20px)}
  #corner{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:6px;z-index:5}
  #corner button{min-height:36px;min-width:36px;border-radius:18px;border:0;background:rgba(255,250,240,.8);font-size:14px;font-weight:600}
  #corner button.on{background:#ff8a5c;color:#fff}
  body.rec #corner,body.rec #stam{display:none}
  #brain{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 54px);width:min(56vw,280px);height:62vh;display:flex;flex-direction:column;background:rgba(255,250,240,.86);border-radius:12px;font-size:10.5px;line-height:1.38;color:#3d3630;box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:6;overflow:hidden}
  #brain .tabs{display:flex;border-bottom:1px solid rgba(0,0,0,.1)} #brain .tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:#7a6e63}
  #brain .tabs button.on{color:#c4512f;border-bottom:2px solid #c4512f}
  #brain .pane{flex:1;overflow-y:auto;padding:6px 9px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #brain b{font-weight:700} #brain .hl{background:#ffe2c8;border-radius:4px} #brain .sec{font-weight:700;margin-top:6px;color:#8a5a3c}
  #brain .row{display:flex;justify-content:space-between;gap:6px} #brain .row span:last-child{font-weight:600;text-align:right}
  #brain .seg{padding:2px 4px;border-left:3px solid transparent} #brain .seg.cur{background:#ffe2c8;border-left-color:#c4512f;font-weight:600}
  #brain .seg.done{opacity:.45} #brain .bar{height:7px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden;margin:2px 0 4px} #brain .bar i{display:block;height:100%}
  body.nodbg #brain,body.rec #brain{display:none}
  #cap,#tip,#stam{display:none !important}
  #trick{display:none !important}
  #trick0{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 64px);width:74px;height:74px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:20}
  #trick svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
  #trick .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#5b5147;text-align:center;line-height:1.1;pointer-events:none}
  #trick.ready{animation:trPulse 1.4s ease-in-out infinite}
  #trick.ready .lbl{color:#c4512f}
  @keyframes trPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.7}
  #map{position:fixed;inset:0;z-index:30;background:#e9e4d8;display:none}
  #map.on{display:block} #mapC{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #map .mbar{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:flex;gap:6px;align-items:center;padding:0 10px;flex-wrap:wrap}
  #map .mbar>*{background:rgba(255,250,240,.9);border-radius:16px;padding:7px 11px;font-size:12px;font-weight:600;color:#3d3630;text-decoration:none;border:0;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  #mapX{margin-left:auto}
  #map .mmode{top:calc(env(safe-area-inset-top) + 46px)} #map .mbar button.on{background:#3d3630;color:#fff8ec}
  #mapAttr{position:absolute;right:6px;bottom:calc(env(safe-area-inset-bottom) + 6px);max-width:70%;font-size:10px;color:#3d3630;background:rgba(255,250,240,.82);padding:3px 7px;border-radius:8px;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">加载中…<small></small></div>
<div id="tip" style="position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);font-size:12px;opacity:.6;background:rgba(255,250,240,.7);padding:4px 10px;border-radius:10px">单指拖动 360° 转着看 · 双指缩放 · 双击回到身后</div>
<div id="ui">
  <button data-cam="chase" class="on">身后</button>
  <button data-cam="side">侧面</button>
  <button data-cam="front">正面</button>
  <button data-cam="orbit">🔄 360°</button>
  <button id="restart">从头再看</button>
  <button id="slow">慢放</button>
  <button id="tod">☀️ 正午</button>
</div>
<button id="trick" aria-label="花式"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="rgba(255,250,240,.88)"/><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="8"/><circle id="trS" cx="50" cy="50" r="44" fill="none" stroke="#6cbfb0" stroke-width="8" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="276.5" stroke-dashoffset="276.5"/><circle id="trV" cx="50" cy="50" r="34" fill="none" stroke="#9cc3e6" stroke-width="4" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="213.6" stroke-dashoffset="213.6"/></svg><div class="lbl" id="trL">蓄力</div></button>
<div id="stam"><div class="bar"><div id="spdF" class="fill"></div></div><div id="spdT" class="bt">💨</div><div class="bar" id="stamB"><div id="stamF" class="fill"></div></div><div id="stamT" class="bt">🪶</div></div>
<div id="brain"><div class="tabs"><button data-t="girl" class="on">女孩</button><button data-t="nature">自然</button><button data-t="light">光影</button><button data-t="mind">决策</button><button data-t="map">全图</button></div><div class="pane" id="brainPane"></div></div>
<div id="corner"><button id="pause" aria-label="暂停">⏸</button><button id="restart2" aria-label="重开">↺</button><button id="mapBtn" aria-label="地图">🗺</button><button id="snd">🔇</button><button id="dbg">debug</button></div>
<div id="map"><canvas id="mapC"></canvas><div class="mbar"><span id="mapInfo"></span><a id="mapG" target="_blank" rel="noopener">Google 地图 ↗</a><a id="mapE" target="_blank" rel="noopener">Google Earth 3D ↗</a><button id="mapX">✕</button></div><div class="mbar mmode"><button data-mm="ours" class="on">我们 2D</button><button data-mm="o3d">我们 3D</button><button data-mm="sat">卫星</button><button data-mm="cmp">对比</button><button id="mapSrc">NSW 航拍</button><button id="mapLn">叠线</button></div><div id="mapAttr"></div></div>
<div id="load">加载女孩模型（10MB）…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="./js/lab.js"></script>
</body>
</html>
